<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ccGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#ccGrad)"/>
  <!-- Interlocking Node Network Graphic -->
  <circle cx="70" cy="70" r="18" fill="#ffffff"/>
  <circle cx="130" cy="70" r="14" fill="#67e8f9"/>
  <circle cx="100" cy="130" r="20" fill="#ffffff"/>
  <!-- Connecting Lines -->
  <line x1="70" y1="70" x2="130" y2="70" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="70" x2="100" y2="130" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="70" x2="100" y2="130" stroke="#67e8f9" stroke-width="6" stroke-linecap="round"/>
  <!-- Inner Dots -->
  <circle cx="70" cy="70" r="6" fill="#1e3a8a"/>
  <circle cx="100" cy="130" r="7" fill="#0284c7"/>
</svg>
