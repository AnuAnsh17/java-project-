name: Campus Connect CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: ci-campus-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      JWT_SECRET: ci-only-signing-key-long-enough-for-local-tests-123456789
      APP_PORT: 3000
      DB_URL: jdbc:mysql://127.0.0.1:3306/campus_connect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: campus
      DB_PASSWORD: ci-campus-password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: campus_connect
          MYSQL_USER: campus
          MYSQL_PASSWORD: ci-campus-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucampus -pci-campus-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode test

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start Docker services
        run: docker compose up --build -d

      - name: Smoke test registration, JWT, CRUD, and authorization
        run: python scripts/e2e-smoke.py http://localhost:3000/api

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down
